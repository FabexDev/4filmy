<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4filmy</title>
<style>
:root{
  --bg:#0b1220; --bg2:#0f1830; --card:#111b34;
  --accent:#2f6bff; --accent2:#4f8cff;
  --text:#e6ecff; --muted:#8fa0c9; --border:#1e2a4a;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
a{color:inherit;text-decoration:none;}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border);}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px;color:var(--accent2);display:flex;align-items:center;gap:8px;cursor:pointer;}
.logo .dot{width:10px;height:10px;background:var(--accent);border-radius:50%;display:inline-block;}
.search{flex:1;display:flex;max-width:640px;margin:0 auto;}
.search input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid var(--border);background:#0d1630;color:var(--text);outline:none;font-size:14px;}
main{max-width:1200px;margin:0 auto;padding:24px 20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .15s ease,border-color .15s ease;cursor:pointer;}
.card:hover{transform:translateY(-3px);border-color:var(--accent);}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--accent) 0%,#0d1630 100%);background-size:cover;background-position:center;position:relative;}
.thumb .playbtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.thumb .playbtn .circle{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
.thumb svg{width:22px;height:22px;opacity:.95;}
.meta{padding:12px 14px;}
.meta h3{margin:0 0 6px;font-size:15px;line-height:1.3;font-weight:600;word-break:break-word;}
.meta span.size{color:var(--muted);font-size:12px;}
.stats{display:flex;gap:14px;margin-top:8px;color:var(--muted);font-size:12px;}
.stats span{display:flex;align-items:center;gap:4px;}
.stats svg{width:13px;height:13px;opacity:.85;}
.empty{color:var(--muted);padding:60px 20px;text-align:center;font-size:15px;}
.watchwrap{max-width:900px;margin:0 auto;}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--accent2);margin-bottom:14px;font-size:14px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;}

/* ==== CUSTOM PLAYER ==== */
.player{position:relative;width:100%;background:#000;border-radius:12px;border:1px solid var(--border);overflow:hidden;}
.player video, .player audio{width:100%;display:block;max-height:520px;background:#000;}
.player.audio-mode{padding:40px 20px;display:flex;align-items:center;justify-content:center;}
.player.audio-mode audio{width:100%;}
.controls{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0a1224;border-top:1px solid var(--border);}
.ctrlbtn{background:none;border:none;color:var(--text);cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.ctrlbtn:hover{background:rgba(255,255,255,.08);}
.ctrlbtn svg{width:20px;height:20px;fill:currentColor;}
.progress{flex:1;height:6px;background:#1e2a4a;border-radius:4px;cursor:pointer;position:relative;}
.progressFill{height:100%;background:var(--accent);border-radius:4px;width:0%;position:relative;}
.progressFill::after{content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:12px;height:12px;background:var(--accent2);border-radius:50%;}
.timeLabel{font-size:12px;color:var(--muted);white-space:nowrap;min-width:90px;text-align:center;}
.volwrap{display:flex;align-items:center;gap:4px;}
.volwrap input[type=range]{width:70px;accent-color:var(--accent);}
.player-error{padding:40px 20px;text-align:center;color:var(--muted);}
.player-error a{color:var(--accent2);text-decoration:underline;}
/* ======================= */

.title{font-size:20px;font-weight:700;margin:16px 0 4px;}
.subinfo{color:var(--muted);font-size:13px;margin-bottom:20px;display:flex;gap:16px;}
.comments{margin-top:24px;border-top:1px solid var(--border);padding-top:18px;}
.comments h3{font-size:16px;margin-bottom:6px;}
.comments .hint{color:var(--muted);font-size:12px;margin-bottom:14px;}
.commentform{margin-bottom:20px;}
.commentform .row1{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.commentform input[type=text]:first-child{flex:0 0 160px;}
.commentform input[type=text]{padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:#0d1630;color:var(--text);font-size:14px;}
.commentform input.msg{flex:1;min-width:200px;}
.commentform .row2{display:flex;justify-content:space-between;align-items:center;}
.charcount{color:var(--muted);font-size:12px;}
.charcount.limitclose{color:#ff9f43;}
.charcount.limitmax{color:#ff5555;}
.commentform button{padding:10px 18px;border-radius:8px;border:none;background:var(--accent);color:white;font-weight:600;cursor:pointer;}
.commentform button:disabled{opacity:.5;cursor:not-allowed;}
.comment{padding:10px 0;border-bottom:1px solid var(--border);}
.comment b{color:var(--accent2);}
.comment .date{color:var(--muted);font-size:11px;margin-left:6px;}
.comment p{margin:4px 0 0;font-size:14px;line-height:1.4;word-break:break-word;}
.nocomments{color:var(--muted);font-size:14px;}
.loading{color:var(--muted);padding:60px 20px;text-align:center;}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="location.hash='#/'"><span class="dot"></span>4filmy</div>
  <div class="search" id="searchWrap">
    <input type="text" id="searchInput" placeholder="Szukaj filmu...">
  </div>
</header>
<main id="app"><div class="loading">Ładowanie...</div></main>

<script>
// ====== KONFIGURACJA — zmień na swoje dane ======
const GITHUB_OWNER  = "FabexDev";     // Twój login na GitHubie
const GITHUB_REPO   = "4filmy";       // nazwa repozytorium
const GITHUB_BRANCH = "main";         // gałąź, na której trzymasz pliki
const VIDEOS_FOLDER = "";             // puste = filmy leżą w głównym katalogu repo (root gałęzi "main")
const COMMENT_MAX_LENGTH = 300;       // limit znaków komentarza
// =================================================

const VIDEO_EXT = ['mp4','webm','mov','m4v','mkv','avi','ogv','ogg'];
const AUDIO_EXT = ['wav'];
const ALL_MEDIA_EXT = [...VIDEO_EXT, ...AUDIO_EXT];

const MIME_MAP = {
  mp4:'video/mp4', webm:'video/webm', ogv:'video/ogg', ogg:'video/ogg',
  mov:'video/quicktime', m4v:'video/x-m4v', mkv:'video/x-matroska',
  avi:'video/x-msvideo', wav:'audio/wav'
};

let ALL_VIDEOS = [];

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function titleFromName(name){
  const dot = name.lastIndexOf('.');
  const base = dot > 0 ? name.slice(0, dot) : name;
  return base.replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
}

function getExt(name){
  return name.split('.').pop().toLowerCase();
}

function isMedia(name){
  return ALL_MEDIA_EXT.includes(getExt(name));
}

function isAudio(name){
  return AUDIO_EXT.includes(getExt(name));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function playIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>`;
}
function eyeIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-7A2.5 2.5 0 1 0 12 14a2.5 2.5 0 0 0 0-4.5z"/></svg>`;
}
function bubbleIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V6a1 1 0 0 1 1-1z"/></svg>`;
}

async function fetchVideos(){
  const path = VIDEOS_FOLDER ? `/${VIDEOS_FOLDER}` : '';
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents${path}?ref=${GITHUB_BRANCH}`;
  const res = await fetch(url);
  if(!res.ok){
    throw new Error('Nie udało się pobrać listy plików (' + res.status + ')');
  }
  const data = await res.json();
  const videos = data
    .filter(item => item.type === 'file' && isMedia(item.name))
    .map(item => ({ name: item.name, url: item.download_url, size: item.size, path: item.path, date: null }));

  // Data publikacji = data ostatniego commita, który dotknął danego pliku
  await Promise.all(videos.map(async v => {
    v.date = await fetchVideoDate(v.path);
  }));

  return videos;
}

async function fetchVideoDate(filePath){
  try{
    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/commits?path=${encodeURIComponent(filePath)}&sha=${GITHUB_BRANCH}&per_page=1`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    if(!data.length) return null;
    const iso = data[0].commit?.committer?.date || data[0].commit?.author?.date;
    return iso ? new Date(iso) : null;
  }catch(e){
    return null;
  }
}

function formatDate(date){
  if(!date) return null;
  return date.toLocaleDateString('pl-PL', { day:'numeric', month:'long', year:'numeric' });
}

// ---- localStorage: komentarze i wyświetlenia ----
function getComments(key){
  try{
    const raw = localStorage.getItem('4filmy:comments:' + key);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveComment(key, author, text){
  const comments = getComments(key);
  comments.push({
    author: author || 'Anonim',
    text,
    date: new Date().toLocaleString('pl-PL', {dateStyle:'short', timeStyle:'short'})
  });
  localStorage.setItem('4filmy:comments:' + key, JSON.stringify(comments));
  return comments;
}
function getViews(key){
  return parseInt(localStorage.getItem('4filmy:views:' + key) || '0', 10);
}
function incrementViews(key){
  const v = getViews(key) + 1;
  localStorage.setItem('4filmy:views:' + key, String(v));
  return v;
}

// ---- Strona główna ----
function renderHome(filterText){
  const app = document.getElementById('app');
  let videos = ALL_VIDEOS;
  if(filterText){
    const q = filterText.toLowerCase();
    videos = videos.filter(v => titleFromName(v.name).toLowerCase().includes(q));
  }

  if(videos.length === 0){
    const where = VIDEOS_FOLDER ? `folderze "${VIDEOS_FOLDER}"` : 'głównym katalogu repozytorium';
    app.innerHTML = `<div class="empty">${filterText ? 'Brak wyników dla: ' + escapeHtml(filterText) : 'Brak filmów w ' + where + '. Wgraj pliki wideo do repozytorium.'}</div>`;
    return;
  }

  app.innerHTML = `<div class="grid">${videos.map((v, i) => {
    const views = getViews(v.name);
    const commCount = getComments(v.name).length;
    const dateStr = formatDate(v.date);
    return `
    <div class="card" onclick="location.hash='#/watch/${encodeURIComponent(v.name)}'">
      <div class="thumb" id="thumb-${i}"><div class="playbtn"><div class="circle">${playIconSvg()}</div></div></div>
      <div class="meta">
        <h3>${escapeHtml(titleFromName(v.name))}</h3>
        <span class="size">${(v.size/1024/1024).toFixed(1)} MB${dateStr ? ' · ' + escapeHtml(dateStr) : ''}</span>
        <div class="stats">
          <span>${eyeIconSvg()} ${views}</span>
          <span>${bubbleIconSvg()} ${commCount}</span>
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;

  videos.forEach((v, i) => {
    if(isAudio(v.name)) return;
    const el = document.getElementById('thumb-' + i);
    if(el) generateThumbnail(v.url, el);
  });
}

function generateThumbnail(url, thumbEl){
  const vid = document.createElement('video');
  vid.crossOrigin = 'anonymous';
  vid.preload = 'metadata';
  vid.muted = true;
  vid.playsInline = true;
  vid.src = url;

  vid.addEventListener('loadedmetadata', () => {
    if(isFinite(vid.duration) && vid.duration > 0){
      vid.currentTime = vid.duration / 2;
    } else {
      vid.currentTime = 1;
    }
  });

  vid.addEventListener('seeked', () => {
    try{
      const canvas = document.createElement('canvas');
      canvas.width = vid.videoWidth;
      canvas.height = vid.videoHeight;
      if(canvas.width === 0 || canvas.height === 0) return;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      thumbEl.style.backgroundImage = `url(${dataUrl})`;
    }catch(e){
      // np. brak CORS na pliku — zostaje gradient
    }
  });

  vid.addEventListener('error', () => {
    // nieobsługiwany format — miniaturka zostaje gradientem
  });
}

// ---- Strona filmu ----
function renderWatch(name){
  const app = document.getElementById('app');
  const video = ALL_VIDEOS.find(v => v.name === name);

  if(!video){
    app.innerHTML = `<div class="empty">Film nie znaleziony. <button class="backlink" onclick="location.hash='#/'">&larr; Strona główna</button></div>`;
    return;
  }

  const title = titleFromName(video.name);
  const comments = getComments(video.name);
  const views = incrementViews(video.name);
  const audio = isAudio(video.name);
  const ext = getExt(video.name);
  const mime = MIME_MAP[ext] || '';

  app.innerHTML = `
    <div class="watchwrap">
      <button class="backlink" onclick="location.hash='#/'">&larr; Strona główna</button>

      <div class="player ${audio ? 'audio-mode' : ''}" id="playerBox">
        <${audio ? 'audio' : 'video'} id="mediaEl" playsinline>
          <source src="${escapeHtml(video.url)}" type="${mime}">
        </${audio ? 'audio' : 'video'}>
        <div class="controls" id="controls">
          <button class="ctrlbtn" id="playBtn" title="Odtwórz/pauza"></button>
          <span class="timeLabel" id="timeLabel">0:00 / 0:00</span>
          <div class="progress" id="progress"><div class="progressFill" id="progressFill"></div></div>
          <div class="volwrap">
            <button class="ctrlbtn" id="muteBtn" title="Wycisz"></button>
            <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
          </div>
          ${audio ? '' : `<button class="ctrlbtn" id="fsBtn" title="Pełny ekran"></button>`}
        </div>
        <div class="player-error" id="playerError" style="display:none"></div>
      </div>

      <div class="title">${escapeHtml(title)}</div>
      <div class="subinfo">
        <span>${(video.size/1024/1024).toFixed(1)} MB</span>
        <span>${views} wyświetleń</span>
        ${formatDate(video.date) ? `<span>Opublikowano: ${escapeHtml(formatDate(video.date))}</span>` : ''}
      </div>

      <div class="comments">
        <h3>Komentarze (<span id="commentCount">${comments.length}</span>)</h3>
        <p class="hint">Komentarze zapisują się lokalnie w tej przeglądarce.</p>
        <form class="commentform" id="commentForm">
          <div class="row1">
            <input type="text" id="commentAuthor" placeholder="Twoje imię" maxlength="40">
            <input type="text" id="commentText" class="msg" placeholder="Napisz komentarz..." maxlength="${COMMENT_MAX_LENGTH}" required>
          </div>
          <div class="row2">
            <span class="charcount" id="charCount">0/${COMMENT_MAX_LENGTH}</span>
            <button type="submit" id="submitBtn">Dodaj</button>
          </div>
        </form>
        <div id="commentsList">${renderCommentsHtml(comments)}</div>
      </div>
    </div>`;

  initPlayer(video, audio);
  initCommentForm(video.name);
}

function initPlayer(video, audio){
  const media = document.getElementById('mediaEl');
  const playBtn = document.getElementById('playBtn');
  const muteBtn = document.getElementById('muteBtn');
  const volSlider = document.getElementById('volSlider');
  const progress = document.getElementById('progress');
  const progressFill = document.getElementById('progressFill');
  const timeLabel = document.getElementById('timeLabel');
  const fsBtn = document.getElementById('fsBtn');
  const playerBox = document.getElementById('playerBox');
  const errorBox = document.getElementById('playerError');

  const iconPlay = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
  const iconPause = `<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`;
  const iconVolOn = `<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/></svg>`;
  const iconVolOff = `<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.6 2 2.7-2.7-1.1-1.1L15.5 10.9l-2.7-2.7-1.1 1.1L14.4 12l-2.7 2.7 1.1 1.1 2.7-2.7 2.7 2.7 1.1-1.1L16.6 12z"/></svg>`;
  const iconFs = `<svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm16 0v6h-6v-2h4v-4h2z"/></svg>`;

  playBtn.innerHTML = iconPlay;
  muteBtn.innerHTML = iconVolOn;
  if(fsBtn) fsBtn.innerHTML = iconFs;

  function fmt(t){
    if(!isFinite(t)) return '0:00';
    const m = Math.floor(t/60);
    const s = Math.floor(t%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  playBtn.addEventListener('click', () => {
    if(media.paused){ media.play(); } else { media.pause(); }
  });
  media.addEventListener('play', () => { playBtn.innerHTML = iconPause; });
  media.addEventListener('pause', () => { playBtn.innerHTML = iconPlay; });

  media.addEventListener('timeupdate', () => {
    const pct = media.duration ? (media.currentTime / media.duration) * 100 : 0;
    progressFill.style.width = pct + '%';
    timeLabel.textContent = `${fmt(media.currentTime)} / ${fmt(media.duration)}`;
  });
  media.addEventListener('loadedmetadata', () => {
    timeLabel.textContent = `${fmt(media.currentTime)} / ${fmt(media.duration)}`;
  });

  progress.addEventListener('click', (e) => {
    if(!isFinite(media.duration)) return;
    const rect = progress.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    media.currentTime = pct * media.duration;
  });

  muteBtn.addEventListener('click', () => {
    media.muted = !media.muted;
    muteBtn.innerHTML = media.muted ? iconVolOff : iconVolOn;
  });
  volSlider.addEventListener('input', () => {
    media.volume = parseFloat(volSlider.value);
    media.muted = media.volume === 0;
    muteBtn.innerHTML = media.muted ? iconVolOff : iconVolOn;
  });

  if(fsBtn){
    fsBtn.addEventListener('click', () => {
      if(playerBox.requestFullscreen) playerBox.requestFullscreen();
    });
  }

  media.addEventListener('error', () => {
    playerBox.querySelector('#controls').style.display = 'none';
    media.style.display = 'none';
    errorBox.style.display = 'block';
    errorBox.innerHTML = `Nie udało się odtworzyć tego pliku bezpośrednio w przeglądarce (nieobsługiwany format/kodek).<br><br><a href="${escapeHtml(video.url)}" target="_blank" rel="noopener">Pobierz plik / otwórz w nowej karcie</a>`;
  });
}

function initCommentForm(videoName){
  const form = document.getElementById('commentForm');
  const textInput = document.getElementById('commentText');
  const charCount = document.getElementById('charCount');
  const submitBtn = document.getElementById('submitBtn');

  function updateCount(){
    const len = textInput.value.length;
    charCount.textContent = `${len}/${COMMENT_MAX_LENGTH}`;
    charCount.classList.toggle('limitclose', len >= COMMENT_MAX_LENGTH * 0.85 && len < COMMENT_MAX_LENGTH);
    charCount.classList.toggle('limitmax', len >= COMMENT_MAX_LENGTH);
  }
  textInput.addEventListener('input', () => {
    if(textInput.value.length > COMMENT_MAX_LENGTH){
      textInput.value = textInput.value.slice(0, COMMENT_MAX_LENGTH);
    }
    updateCount();
  });
  updateCount();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const author = document.getElementById('commentAuthor').value.trim();
    const text = textInput.value.trim().slice(0, COMMENT_MAX_LENGTH);
    if(!text) return;
    submitBtn.disabled = true;
    const updated = saveComment(videoName, author, text);
    document.getElementById('commentsList').innerHTML = renderCommentsHtml(updated);
    document.getElementById('commentCount').textContent = updated.length;
    textInput.value = '';
    updateCount();
    submitBtn.disabled = false;
  });
}

function renderCommentsHtml(comments){
  if(comments.length === 0) return `<p class="nocomments">Brak komentarzy. Bądź pierwszy!</p>`;
  return comments.slice().reverse().map(c => `
    <div class="comment">
      <b>${escapeHtml(c.author)}</b><span class="date">${escapeHtml(c.date)}</span>
      <p>${escapeHtml(c.text)}</p>
    </div>`).join('');
}

// ---- Routing ----
function route(){
  const hash = location.hash;
  const searchWrap = document.getElementById('searchWrap');

  if(hash.startsWith('#/watch/')){
    searchWrap.style.display = 'none';
    const name = decodeURIComponent(hash.slice('#/watch/'.length));
    renderWatch(name);
  } else {
    searchWrap.style.display = 'flex';
    renderHome(document.getElementById('searchInput').value);
  }
}

document.getElementById('searchInput').addEventListener('input', () => {
  if(!location.hash.startsWith('#/watch/')) renderHome(document.getElementById('searchInput').value);
});

window.addEventListener('hashchange', route);

(async function init(){
  try{
    const videos = await fetchVideos();
    ALL_VIDEOS = shuffle(videos); // losowa kolejność na stronie głównej
    route();
  }catch(err){
    document.getElementById('app').innerHTML = `<div class="empty">Błąd wczytywania listy filmów: ${escapeHtml(err.message)}<br><br>Sprawdź, czy w kodzie ustawione są poprawne GITHUB_OWNER / GITHUB_REPO / GITHUB_BRANCH.</div>`;
  }
})();
</script>
</body>
</html>
